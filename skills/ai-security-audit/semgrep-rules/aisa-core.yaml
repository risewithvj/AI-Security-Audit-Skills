# -----------------------------------------------------------------------------
# AI-Security-Audit-Skills - bundled Semgrep rules (work offline)
# Author   : Vijaya Kumar L  (Rise With VJ)
# GitHub   : https://github.com/risewithvj
# LinkedIn : https://www.linkedin.com/in/vijayakumarl/
# License  : MIT
# High-signal leads for vibe-coded and HR/payroll apps. Every hit is a lead for
# a hunter, never a finding by itself.
# -----------------------------------------------------------------------------
rules:
  - id: aisa.js.jwt-fallback-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: JWT/session secret falls back to a hardcoded value when the env var is missing. Anyone who knows the fallback can forge tokens.
    metadata: {cwe: ["CWE-798: Use of Hard-coded Credentials", "CWE-1188"], owasp: ["A07:2025"], category: insecure-default}
    patterns:
      - pattern-either:
          - pattern: process.env.$ENV || "$LIT"
          - pattern: process.env.$ENV ?? "$LIT"
      - metavariable-regex: {metavariable: $ENV, regex: (?i).*(jwt|secret|session|token|signing|hmac|auth).*}
      # An empty-string fallback (`?? ""` / `|| ''`) fails closed - there is no
      # hardcoded secret to forge with - so require $LIT to be non-empty.
      - metavariable-regex: {metavariable: $LIT, regex: .+}

  - id: aisa.py.secret-default
    languages: [python]
    severity: ERROR
    message: Secret read from the environment with a hardcoded default. Fail at startup instead.
    metadata: {cwe: ["CWE-798: Use of Hard-coded Credentials"], owasp: ["A07:2025"], category: insecure-default}
    patterns:
      - pattern-either:
          - pattern: os.getenv("$ENV", "$LIT")
          - pattern: os.environ.get("$ENV", "$LIT")
      - metavariable-regex: {metavariable: $ENV, regex: (?i).*(secret|jwt|token|key|password).*}

  - id: aisa.js.sql-string-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL built by string concatenation or template interpolation with request data. Use bound parameters.
    metadata: {cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"], owasp: ["A05:2025"], category: injection}
    patterns:
      - pattern-either:
          - pattern: $DB.query("..." + $X + ..., ...)
          - pattern: $DB.query("..." + $X + ...)
          - pattern: $DB.query(`...${$X}...`, ...)
          - pattern: $DB.query(`...${$X}...`)
          - pattern: $DB.raw("..." + $X + ...)
          - pattern: $DB.$queryRawUnsafe(...)
          - pattern: $DB.$executeRawUnsafe(...)

  - id: aisa.py.sql-format
    languages: [python]
    severity: ERROR
    message: SQL built with f-strings, % or .format. Use bound parameters.
    metadata: {cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"], owasp: ["A05:2025"], category: injection}
    pattern-either:
      - pattern: $C.execute(f"...")
      - pattern: $C.execute("..." % ...)
      - pattern: $C.execute("...".format(...))
      - pattern: $C.execute("..." + $X)

  - id: aisa.js.client-exposed-server-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: A server-only secret is read through a client-exposed env prefix (NEXT_PUBLIC_, VITE_, REACT_APP_, EXPO_PUBLIC_). It ships to every browser or app.
    metadata: {cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"], owasp: ["A02:2025"], category: secrets}
    patterns:
      - pattern-either:
          - pattern: process.env.$ENV
          - pattern: import.meta.env.$ENV
      - metavariable-regex:
          metavariable: $ENV
          regex: (?i)^(NEXT_PUBLIC_|VITE_|REACT_APP_|EXPO_PUBLIC_|NUXT_PUBLIC_|PUBLIC_|GATSBY_).*(SERVICE_?ROLE|SECRET|PRIVATE|ADMIN|DATABASE_URL|DB_URL|PASSWORD|OPENAI|ANTHROPIC|GEMINI|STRIPE_SECRET|RAZORPAY_KEY_SECRET|SK_).*

  - id: aisa.js.payment-amount-from-client
    languages: [javascript, typescript]
    severity: ERROR
    message: Payment amount or price comes from the request body. Look the price up on the server.
    metadata: {cwe: ["CWE-602: Client-Side Enforcement of Server-Side Security", "CWE-840"], owasp: ["A06:2025"], category: business-logic}
    pattern-either:
      - pattern: "{..., unit_amount: $REQ.body.$F, ...}"
      - pattern: "{..., amount: $REQ.body.$F, ...}"
      - pattern: "{..., price: $REQ.body.$F, ...}"

  - id: aisa.js.idor-param-to-query
    languages: [javascript, typescript]
    severity: WARNING
    message: A route parameter that looks like an owner or object id reaches a database call. Confirm an ownership or tenant check binds it to req.user.
    metadata: {cwe: ["CWE-639: Authorization Bypass Through User-Controlled Key"], owasp: ["A01:2025", "API1:2023"], category: access-control}
    patterns:
      - pattern-either:
          - pattern: $DB.$Q(..., [..., $REQ.params.$ID, ...], ...)
          - pattern: |
              const { ..., $ID, ... } = $REQ.params;
              ...
              $DB.$Q(..., [..., $ID, ...], ...)
          - pattern: $M.findById($REQ.params.$ID)
          - pattern: $M.findByPk($REQ.params.$ID)
      - metavariable-regex: {metavariable: $ID, regex: (?i).*(id|employee|user|account|owner|org|tenant|document|doc|file).*}

  - id: aisa.js.pii-in-logs
    languages: [javascript, typescript]
    severity: WARNING
    message: Personal or sensitive data appears in a log call (Aadhaar, PAN, bank, salary, OTP, password, token). Logs are widely readable and retained.
    metadata: {cwe: ["CWE-532: Insertion of Sensitive Information into Log File"], owasp: ["A09:2025"], category: privacy}
    patterns:
      - pattern-either:
          - pattern: console.$LOG(...)
          - pattern: logger.$LOG(...)
      - pattern-regex: (?i)(aadh?aa?r|\bpan\b|bank_?acc|account_?no|ifsc|salary|net_?pay|\botp\b|password|passwd|token|secret)

  - id: aisa.js.jwt-decode-without-verify
    languages: [javascript, typescript]
    severity: ERROR
    message: jwt.decode() trusts the token without checking its signature. Use jwt.verify() with an explicit algorithm list.
    metadata: {cwe: ["CWE-347: Improper Verification of Cryptographic Signature"], owasp: ["A07:2025"], category: auth}
    pattern: jwt.decode(...)

  - id: aisa.js.cors-wildcard-credentials
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS allows any origin together with credentials, or reflects the request origin. Confirm what authenticated data this exposes.
    metadata: {cwe: ["CWE-942: Permissive Cross-domain Policy with Untrusted Domains"], owasp: ["A02:2025"], category: config}
    pattern-either:
      - pattern: "cors({..., origin: true, ..., credentials: true, ...})"
      - pattern: "cors({..., origin: '*', ..., credentials: true, ...})"

  - id: aisa.js.insecure-random-token
    languages: [javascript, typescript]
    severity: WARNING
    message: Math.random() used near token, OTP, password or reset-link generation. Use crypto.randomBytes / crypto.randomUUID.
    metadata: {cwe: ["CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"], owasp: ["A04:2025"], category: crypto}
    patterns:
      - pattern: Math.random()
      - pattern-inside: |
          function $F(...) { ... }
      - metavariable-regex: {metavariable: $F, regex: (?i).*(token|otp|code|password|secret|reset|invite|key|nonce).*}

  - id: aisa.tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate verification is disabled.
    metadata: {cwe: ["CWE-295: Improper Certificate Validation"], owasp: ["A04:2025"], category: crypto}
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: aisa.py.tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification is disabled.
    metadata: {cwe: ["CWE-295: Improper Certificate Validation"], owasp: ["A04:2025"], category: crypto}
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: httpx.$M(..., verify=False, ...)

  - id: aisa.js.eval-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic code execution. Confirm no request, file or model output reaches it.
    metadata: {cwe: ["CWE-95: Eval Injection"], owasp: ["A05:2025"], category: injection}
    pattern-either:
      - pattern: eval($X)
      - pattern: new Function(...)
      - pattern: vm.runInNewContext(...)
      - pattern: vm.runInContext(...)

  - id: aisa.js.child-process-exec
    languages: [javascript, typescript]
    severity: WARNING
    message: Shell command execution. Confirm no user, file or model-controlled data reaches the command string.
    metadata: {cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"], owasp: ["A05:2025"], category: injection}
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: require('child_process').exec(...)
      - pattern: exec(`...${$X}...`, ...)
      - pattern: execSync(`...${$X}...`, ...)

  - id: aisa.html.dangerous-raw-html
    languages: [javascript, typescript]
    severity: WARNING
    message: Raw HTML rendering. Confirm the value cannot contain attacker-controlled markup.
    metadata: {cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation"], owasp: ["A05:2025"], category: xss}
    pattern-either:
      - pattern: "<$EL dangerouslySetInnerHTML={...} />"
      - pattern: $E.innerHTML = $X
      - pattern: $E.outerHTML = $X
      - pattern: document.write($X)
